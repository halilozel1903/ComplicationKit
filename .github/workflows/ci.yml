name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build (macOS host)
        run: swift build
      - name: Test (macOS host)
        run: swift test
      - name: Install watchOS platform if missing
        run: |
          if ! xcrun simctl list runtimes available | grep -q watchOS; then
            xcodebuild -downloadPlatform watchOS
          fi
      - name: Build for watchOS Simulator
        run: |
          xcodebuild build \
            -scheme ComplicationKit \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme ComplicationKit \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  example:
    name: Example app and widget extension
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install watchOS platform if missing
        run: |
          if ! xcrun simctl list runtimes available | grep -q watchOS; then
            xcodebuild -downloadPlatform watchOS
          fi
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Build the gallery app and the Hydrate widgets for watchOS Simulator
        run: |
          xcodebuild build \
            -project Example/ComplicationDemo.xcodeproj \
            -scheme ComplicationDemo \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: README screenshots
    if: github.event_name != 'pull_request'
    needs: [test, example]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Capture screenshots (Apple Watch)
        run: bash scripts/screenshots.sh ComplicationDemo io.github.halilozel1903.ComplicationDemo circular corner rectangular face
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
