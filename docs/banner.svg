<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="ComplicationKit: WidgetKit complications for Apple Watch" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="1" stop-color="#0a1320"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#296bff"/>
      <stop offset="1" stop-color="#38c7ff"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#16191e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- Title -->
  <text x="88" y="214" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">ComplicationKit</text>
  <text x="90" y="268" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#9fb3c8">WidgetKit complications for Apple Watch</text>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="90" y="312" width="118" height="40" rx="20" fill="#38c7ff" fill-opacity="0.14"/>
    <text x="149" y="339" text-anchor="middle" fill="#38c7ff">Circular</text>
    <rect x="220" y="312" width="104" height="40" rx="20" fill="#38c7ff" fill-opacity="0.14"/>
    <text x="272" y="339" text-anchor="middle" fill="#38c7ff">Corner</text>
    <rect x="336" y="312" width="154" height="40" rx="20" fill="#38c7ff" fill-opacity="0.14"/>
    <text x="413" y="339" text-anchor="middle" fill="#38c7ff">Rectangular</text>
    <rect x="502" y="312" width="100" height="40" rx="20" fill="#38c7ff" fill-opacity="0.14"/>
    <text x="552" y="339" text-anchor="middle" fill="#38c7ff">Inline</text>
  </g>
  <text x="90" y="400" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#6f8296">Tinting · timelines · Smart Stack relevance · preview gallery</text>

  <!-- Watch -->
  <g filter="url(#shadow)">
    <rect x="1006" y="88" width="34" height="70" rx="10" fill="#2a2e35"/>
    <rect x="760" y="70" width="268" height="420" rx="78" fill="url(#case)"/>
    <rect x="776" y="86" width="236" height="388" rx="64" fill="#000000"/>
  </g>
  <rect x="776" y="86" width="236" height="388" rx="64" fill="url(#glow)"/>

  <!-- Inline -->
  <g font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" font-weight="600">
