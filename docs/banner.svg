      <rect x="872" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
      <rect x="884" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
      <rect x="896" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
      <rect x="908" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
      <rect x="920" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
      <rect x="932" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
      <rect x="944" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
      <rect x="956" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
      <rect x="968" y="304" width="9" height="2" rx="1" fill-opacity="0.5"/>
