  <path d="M972 426 a7 7 0 0 1 7 7 v6 l3 3 h-20 l3 -3 v-6 a7 7 0 0 1 7 -7z" fill="#38c7ff"/>
  <text x="926" y="466" font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#38c7ff" transform="rotate(-8 926 466)">21M</text>
