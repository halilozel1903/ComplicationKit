  <!-- Circular ring -->
  <circle cx="894" cy="384" r="34" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="894" cy="384" r="27" fill="none" stroke="#38c7ff" stroke-opacity="0.3" stroke-width="6"/>
  <circle cx="894" cy="384" r="27" fill="none" stroke="#38c7ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="81.4 170" transform="rotate(-90 894 384)"/>
  <path d="M894 368 q5 7 5 10 a5 5 0 1 1 -10 0 q0 -3 5 -10z" fill="#38c7ff"/>
  <text x="894" y="401" text-anchor="middle" font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">1.2</text>

