  <path d="M816 424 q6 8 6 12 a6 6 0 1 1 -12 0 q0 -4 6 -12z" fill="#38c7ff"/>
  <path d="M850 452 Q 866 462 884 465" fill="none" stroke="url(#water)" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
