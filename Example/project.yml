name: ComplicationDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    watchOS: "10.0"
packages:
  ComplicationKit:
    path: ..
targets:
  ComplicationDemo:
    # A standalone (watch-only) app: one application target built with the watchOS SDK, no iOS companion.
    # It embeds the Hydrate widget extension, so its complications can be added to a real watch face.
    type: application
    platform: watchOS
    sources:
      - ComplicationDemo
      - Shared
    dependencies:
      - package: ComplicationKit
      - target: HydrateWidgets
    info:
      path: ComplicationDemo-Info.plist
      properties:
        CFBundleDisplayName: Complications
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.ComplicationDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Complications
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"

  HydrateWidgets:
    # The WidgetKit extension of the fictional Hydrate water tracker: a progress complication and a countdown to the
    # next glass, in every accessory family.
    type: app-extension
    platform: watchOS
    sources:
      - HydrateWidgets
      - Shared
    dependencies:
      - package: ComplicationKit
    info:
      path: HydrateWidgets-Info.plist
      properties:
        CFBundleDisplayName: Hydrate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.ComplicationDemo.HydrateWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hydrate
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
schemes:
  ComplicationDemo:
    build:
      targets:
        ComplicationDemo: all
        HydrateWidgets: all
    run:
      config: Debug
